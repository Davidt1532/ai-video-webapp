services:
  - type: web
    name: ai-story-video
    runtime: python
    plan: free
    region: ohio
    buildCommand: bash -c "apt-get update -qq && apt-get install -y -qq ffmpeg && pip install -r requirements.txt"
    startCommand: cd webapp && uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: VIDEO_API_KEY
        sync: false
      - key: VIDEO_API_KEYS
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://ai-video-webapp-3.onrender.com
      - key: PYTHONUNBUFFERED
        value: "1"